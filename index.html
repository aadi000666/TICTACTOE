<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <div class="start-menu">
            <h1> Tic-Tac-Toe</h1>
            <div class="settings">
                <h2>Choose Your Opponent</h2>
                <div class="options">
                    <input type="radio" id="pvp" name="gameMode" value="pvp" checked>
                    <label for="pvp">Player 1 vs Player 2</label>
                    <br>
                    <input type="radio" id="pva" name="gameMode" value="pva">
                    <label for="pva">Player vs  AI</label>
                </div>
            </div>
            <button id="start-button">START</div>
    </div>
    <div id="game-area" class="hidden">
        <h2 class="status-display"></h2>
        <div class="game-container">
            <div class="game-board">
                <div class="cell" data-cell-index="0"></div>
                <div class="cell" data-cell-index="1"></div>
                <div class="cell" data-cell-index="2"></div>
                <div class="cell" data-cell-index="3"></div>
                <div class="cell" data-cell-index="4"></div>
                <div class="cell" data-cell-index="5"></div>
                <div class="cell" data-cell-index="6"></div>
                <div class="cell" data-cell-index="7"></div>
                <div class="cell" data-cell-index="8"></div>
            </div>
        </div>
        <button id="new-game-button">AGAIN</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
